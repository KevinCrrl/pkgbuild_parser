name: Ruff Lint

on: [push, pull_request]

jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Check out source repository
        uses: actions/checkout@v6
      - name: Lint Source Code
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "latest"
          src: >-
            ./pkgbuild_parser
            example.py
